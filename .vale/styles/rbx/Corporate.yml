# docs-writing-style-guide.md §14: "DON'T write utilize/leverage/in order
# to-style corporate register; DO say use, to."
extends: substitution
message: "Use '%s' instead of '%s'."
level: warning
ignorecase: true
swap:
  leverag(?:e|es|ed|ing): use
  utiliz(?:e|es|ed|ing): use
  facilitat(?:e|es|ed|ing): help
  prior to: before

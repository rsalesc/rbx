name: group-vars-violation
timeLimit: 1000
memoryLimit: 256
scoring: POINTS

validator:
  path: validator.cpp

generators:
  - name: gen
    path: gens/gen.cpp

solutions:
  - path: sols/main.cpp
    outcome: ac

vars:
  AB:
    min: -200
    max: 200

testcases:
  # The override raises `AB.min` to 0 for this group only, so `gen -5 5` --
  # perfectly legal at package level, and legal in `full` below -- must be
  # rejected here. This is the regression: before per-group vars there was no
  # way to express it that actually fired.
  - name: nonneg
    score: 40
    vars:
      AB:
        min: 0
    generators:
      - name: gen
        args: 0 3
      - name: gen
        args: -5 5
  # The same shape of input (a negative A) is legal here, where no override
  # applies -- so the failure above is the group's doing, not the validator's.
  - name: full
    score: 60
    generators:
      - name: gen
        args: -200 200
      - name: gen
        args: -5 6

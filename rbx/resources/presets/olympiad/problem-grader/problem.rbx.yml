---
# yaml-language-server: $schema=https://rsalesc.github.io/rbx/schemas/Package.json
name: "new-problem"
# Scored by points, IOI-style: each test group pays its `score` when all of its
# tests pass. Docs: https://rsalesc.github.io/rbx/setters/grading/scoring/
scoring: points
timeLimit: 1000 # ms
memoryLimit: 256 # MiB
languages: ["en"] # Statement languages. Add one with `rbx lang add <lang>`.
titles:
  en: "New function-call problem"
# Function-call problem: every solution is compiled together with this C++
# grader, which owns main(). Solutions must be in C++.
# Docs: https://rsalesc.github.io/rbx/setters/grading/graders/
grader:
  path: "graders/grader.cpp"
  # Replace with your own long random string. The hidden test header and the
  # output framing derive from it; changing it means re-uploading the problem.
  secret: "change-me-to-a-long-random-string"
checker: {path: "checker.cpp"} # Reads the grader's framed output.
validator: {path: "validator.cpp"}
testcases:
  - name: "samples" # A group without a `score` is worth 0 points.
    testcaseGlob: "statement/samples/*.in" # Pattern for the sample inputs.
  - name: "subtask1"
    score: 100
    generatorScript:
      path: "tests/testplan.txt" # Static generator script (testplan).
solutions:
  - path: "sols/main*.*"
    outcome: "ACCEPTED"
  - path: "sols/ac-*.*"
    outcome: "ACCEPTED"
  - path: "sols/wa-*.*"
    outcome: "WRONG_ANSWER"
  - path: "sols/tle-*.*"
    outcome: "TIME_LIMIT_EXCEEDED"
  - path: "sols/mle-*.*"
    outcome: "MEMORY_LIMIT_EXCEEDED"
  - path: "sols/re-*.*"
    outcome: "RUNTIME_ERROR"
  - path: "sols/fail-*.*"
    outcome: "INCORRECT"
# Files given to the participants, packed into build/attachments/<name>.zip.
attachments:
  - path: "graders/grader.cpp"
    stripSecret: true # Drops `// BEGIN SECRET` blocks and inlines rbx.h.
  - path: "graders/aplusb.h"
  - path: "graders/template.cpp"
    name: "aplusb.cpp"
  - samples: "examples"
statements:
  - language: "*" # One statement per language listed in `languages`.
    file: "statement/statement-{lang}.rbx.tex" # Open statement-en.rbx.tex to edit your statement.
    type: "rbxTeX"
    params:
      show_limits: true # Set to false to hide the time/memory limits.
tutorials:
  - language: "*" # One statement per language listed in `languages`.
    file: "statement/editorial-{lang}.rbx.tex" # Open editorial-en.rbx.tex to edit your editorial.
    type: "rbxTeX"
# Variables usable in the validator, checker, interactor, stress tests and statement.
vars:
  # Author name to be displayed in the editorial.
  author: "John Doe"
  # Constraints of the problem.
  N:
    min: 1
    max: 1000000000

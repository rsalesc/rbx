# Vale prose linter for the docs site. Run `vale sync` once, then `vale docs/`
# from the repository root. The workflow, and the adversarial reviewer that goes
# with it, live in .claude/skills/docs-style/SKILL.md.
#
# Layers, all synced into the gitignored .vale/styles/ by `vale sync` except rbx
# (never edit a synced style; override it here):
#   - Google: the Google developer documentation style guide.
#   - Slop (Syntaf/vale-llm-slop): LLM prose tells -- hype vocabulary, ceremony,
#     self-praise, chat voice. Its sibling STE style is deliberately not
#     enabled: ASD-STE100 bans contractions, which the house voice requires.
#   - ai-tells (tbhb/vale-ai-tells): a wider net of AI-writing fingerprints.
#   - rbx: this repository's house voice (.vale/styles/rbx, committed), the
#     checkable subset of docs/plans/docs-writing-style-guide.md.
# Where a package disagrees with the house guide, the house guide wins, and
# every override below says why.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Pinned by release so a sync never changes the rules under us. Bump on purpose.
Packages = Google, \
  https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip
Vocab = rbx

# Only the docs site. CLAUDE.md, READMEs and agent prompts don't render through
# mkdocs, so its macros and voice don't apply to them. Both depths are spelled
# out: Vale's `docs/**.md` silently matches nothing below docs/.
[docs/{*,**/*}.md]
BasedOnStyles = Vale, Google, Slop, ai-tells, rbx

# Markup, not prose: mkdocs-macros calls ({{rbx}}, {{ asciinema("...") }}),
# Jinja tags ({% raw %}), attribute lists ({: #anchor }), emoji and icon
# shortcodes (:white_check_mark:), code-annotation markers (# (1)!) and
# mkdocstrings cross-references ([rbx.box.schema.Package][]).
TokenIgnores = (\{\{.*?\}\}), (\{%.*?%\}), (\{:[^}]*\}), (:[a-z0-9_+-]+:), (\(\d+\)!), (\[[\w.]+\]\[\])
# mkdocstrings `::: module` blocks and their indented options.
BlockIgnores = (?m)^::: .*(?:\n[ \t]+.*)*

# --- Google, bent to the house voice -----------------------------------------
# The maintainer writes as a guide beside the reader ("we'll", "let's"), and the
# house guide asks for it explicitly (§1).
Google.We = NO
# Walkthroughs narrate what is about to happen ("we'll build the package").
# Still worth a look, not worth a warning on nearly every paragraph.
Google.Will = suggestion
# The house guide allows a spaced em dash or `--` (§7). rbx.EmDash replaces it.
Google.EmDash = NO
# rbx.Headings replaces it: same sentence-case check, with this project's
# proper nouns and the capital after a colon ("Step 1: Profile ...").
Google.Headings = NO
# Fires on proper nouns after a colon ("Packaging: BOCA", "TLE: ...").
Google.Colons = suggestion

# --- Slop ----------------------------------------------------------------------
# Hype and corporate vocabulary (robust, seamless, leverage, utilize) is a DON'T
# in the house guide (§13, §14), not a maybe. rbx.Hype covers the words Slop
# doesn't list.
Slop.Overused = warning

# --- ai-tells --------------------------------------------------------------------
# Off: contradicts the house guide or Google, or duplicates a rule above.
# `--` is the house em dash (§7); rbx.EmDash and Slop.EmDash ration both forms.
ai-tells.DoubleHyphen = NO
ai-tells.EmDashUsage = NO
# Google.Colons and Google.Semicolons already cover these.
ai-tells.ColonUsage = NO
ai-tells.SemicolonUsage = NO
# Flags "for example", the exact phrase Google.Latin asks for instead of "e.g.".
ai-tells.FormalTransitions = NO
# Question headings ("Why a preset?", "What about the outputs?") are house
# style (§4).
ai-tells.ExplainerHeadings = NO
# "rbx ships the interactor" is the literal meaning, not a tell.
ai-tells.ShipOveruse = NO
# Google.Anthropomorphism and Slop.Anthropomorphism already cover it.
ai-tells.AnthropomorphicCognition = NO

# ai-tells makes every rule an error. The rules below fire on the existing,
# mostly hand-written docs, so here they are judgment calls for the writer and
# the docs-style-reviewer, not blockers. Every other ai-tells rule stays an
# error: it never fires on this corpus, so a hit in new prose is a real tell.
# Regenerate this list when bumping ai-tells (see the docs-style skill).
ai-tells.AICompoundPhrases = warning
ai-tells.AbsoluteAssertions = warning
ai-tells.AbstractionSubject = warning
ai-tells.AnthropomorphicAdjectives = warning
ai-tells.AnthropomorphicJustification = warning
ai-tells.BareHolds = warning
ai-tells.BareNames = warning
ai-tells.BareReaches = warning
ai-tells.CataphoricForecasting = warning
ai-tells.ColloquialAssessments = warning
ai-tells.ConclusionMarkers = warning
ai-tells.ConsequenceClause = warning
ai-tells.ConsequenceParticiple = warning
ai-tells.ContrastiveFormulas = warning
ai-tells.ContrastiveNegation = warning
ai-tells.CoordinatedReveal = warning
ai-tells.DefensiveHedges = warning
ai-tells.EmphaticCopula = warning
ai-tells.EmptyPadding = warning
ai-tells.EmptyPaddingStacked = warning
ai-tells.EvasionMetaphors = warning
ai-tells.ExplainerLeads = warning
ai-tells.FigurativeCarries = warning
ai-tells.FigurativeEarns = warning
ai-tells.FigurativeFalls = warning
ai-tells.FigurativeIdioms = warning
ai-tells.FigurativeKeeps = warning
ai-tells.FigurativeLands = warning
ai-tells.FigurativeLives = warning
ai-tells.FigurativeMints = warning
ai-tells.FigurativeNouns = warning
ai-tells.FigurativeOwns = warning
ai-tells.FigurativeQuantities = warning
ai-tells.FigurativeQuiet = warning
ai-tells.FigurativeReaches = warning
ai-tells.FigurativeShape = warning
ai-tells.FigurativeSits = warning
ai-tells.FigurativeStays = warning
ai-tells.FigurativeSurfaces = warning
ai-tells.FigurativeTravels = warning
ai-tells.FigurativeWins = warning
ai-tells.FigurativeWorth = warning
ai-tells.FillerIntensifier = warning
ai-tells.FillerPhrases = warning
ai-tells.FormalRegister = warning
ai-tells.HedgingPhrases = warning
ai-tells.JourneyMetaphors = warning
ai-tells.LabelAndExplain = warning
ai-tells.Metacommentary = warning
ai-tells.MicDrop = warning
ai-tells.MortalityMetaphors = warning
ai-tells.MotionMetaphors = warning
ai-tells.NegatedObject = warning
ai-tells.NegatedSubject = warning
ai-tells.NounString = warning
ai-tells.OverusedVocabulary = warning
ai-tells.ParallelStaccato = warning
ai-tells.PointVerdict = warning
ai-tells.PseudoCleft = warning
ai-tells.RestatementMarkers = warning
ai-tells.SelfReference = warning
ai-tells.ServesAsDodge = warning
ai-tells.ShellNounCopula = warning
ai-tells.StackedAnaphora = warning
ai-tells.StrawmanContrast = warning
ai-tells.SummativeAppositive = warning
ai-tells.SycophancyMarkers = warning
ai-tells.UnderRegime = warning
ai-tells.UniversalObject = warning
ai-tells.UniversalSubject = warning
ai-tells.UnpackExplore = warning
ai-tells.VerbTricolon = warning

# docs/plans/ is the contributor archive (excluded from the site by mkdocs.yml)
# and is never edited for style.
[docs/plans/**]
BasedOnStyles =

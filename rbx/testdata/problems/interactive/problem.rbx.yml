---
name: "test-problem"
type: communication
timeLimit: 1000
memoryLimit: 256
outputLimit: 100 # 100 kb
checker:
  path: "checker.cpp"
interactor:
  path: "interactor.cpp"
  legacy: true
generators:
  - name: "gen"
    path: "gen.cpp"
validator:
  path: "validator.cpp"
testcases:
  - name: "samples"
    testcaseGlob: "manual_tests/samples/*.in"
  - name: "tests"
    generatorScript:
      path: "testplan.txt"
solutions:
  - path: "sols/main.cpp"
    outcome: AC
  - path: "sols/interactive-binary-search_mm_naive_cin.cpp"
    outcome: INCORRECT
  - path: "sols/af_tl_after_ans.cpp"
    outcome: TLE
  - path: "sols/af_wa.cpp"
    outcome: WA
  - path: "sols/af_ac_pe.cpp"
    outcome: WA
  - path: "sols/af_ac_re.cpp"
    outcome: RE
  # Not `ML`: the verdict for a solution over its memory limit depends on the
  # platform. On macOS the RSS watchdog kills it (ML); on Linux `RLIMIT_AS`
  # makes the allocation itself fail, so it dies of `bad_alloc` (RE) and RSS
  # can never exceed a cap that also bounds the address space.
  - path: "sols/af_ml.cpp"
    outcome: MLE_OR_RTE
  - path: "sols/af_inf_cout_without_flush.cpp"
    outcome: TLE
  - path: "sols/af_inf_cout_with_flush.cpp"
    outcome: TLE
  - path: "sols/af_ac_too_many_iter.cpp"
    outcome: INCORRECT
  # Interactor failure sols.
  - path: "sols/int_halt_pe_hangs_before.cpp"
    outcome: WA
  - path: "sols/int_halt_pe_hangs_after.cpp"
    outcome: WA
  - path: "sols/int_halt_pe_hangs_sigpipe.cpp"
    outcome: WA
  - path: "sols/int_halt_pe_hangs_tle.cpp"
    outcome: WA
  - path: "sols/ac_slow_under_2tl.cpp"
    outcome: TLE
  # Python solutions.
  - path: "sols/ac.py"
    outcome: AC
  - path: "sols/ac_invalid_format.py"
    outcome: WA
  - path: "sols/ac_invalid_format_sigpipe.py"
    outcome: WA
  - path: "sols/rte_no_import.py"
    outcome: RTE
  # Java solutions.
  - path: "sols/ac.java"
    outcome: AC
  - path: "sols/ac_invalid_format.java"
    outcome: WA
  - path: "sols/ac_invalid_format_sigpipe.java"
    outcome: WA
  # Kotlin solutions.
  - path: "sols/ac.kt"
    outcome: AC
statements:
  - language: "en"
    title: "Guess The Number"
    file: "statement/statement.rbx.tex"
    type: "rbxTeX"
    params:
      show_limits: true
  - language: "en"
    variant: "pdf"
    title: "New Problem"
    file: "dummy.pdf"
    type: "pdf"
vars:
  N:
    min: 1
    max: 1000000

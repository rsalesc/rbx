scenarios:
  - name: fanout-grader-run
    description: |
      The fanout relay through a grader stub: each of the three processes is
      the stub (graders/grader.cpp) linked with the solution's relay(). The
      interactor is the plain fanout one: rbx::registerFanoutInteraction
      consumes the grader's hidden input header itself.
    steps:
      - cmd: run
        expect:
          solutions:
            sols/main.cpp: ac
            sols/wa.cpp: wa

  - name: fanout-grader-cms-package
    description: |
      On CMS every process is the stub (CMS 1.5.1 spells the grader `stub`)
      linked with the submission, and gets its index as argv[1].
    steps:
      - cmd: package polygon --cms
        expect:
          zip_file_contains:
            path: build/problem.zip
            entries:
              files/cms_conf.py: "/'stub.cpp': 'grader.cpp'.*'task_type_parameters': \\[3, 'stub', 'std_io'\\]/"

scenarios:
  # Without the flag, nothing changes: the checker's diagnostics are dropped and
  # no `.checker.err` is written anywhere.
  - name: absent-by-default
    steps:
      - cmd: build
      - cmd: run -v4
        expect:
          files_absent:
            - "**/*.checker.err"
          solutions:
            sols/main.cpp: ac
            sols/wrong.cpp: wa

  # With it, every testcase keeps the whole stderr -- including the lines the
  # checker printed *before* its verdict line, which is the only place they
  # survive.
  - name: keeps-full-stderr
    steps:
      - cmd: build
      - cmd: run --keep-checker-stderr -v4
        expect:
          files_exist:
            - "**/*.checker.err"
          solutions:
            sols/main.cpp: ac
            sols/wrong.cpp: wa

  # `rbx preship` carries both `rbx run` reporting flags. Each stage stages its
  # run under the same `.rbx/runs` directory, so what is on disk afterwards is
  # the last stage's -- this pins that the flags survive the whole command, and
  # `test_timing_run_flags.py` pins that each of the three stages gets them.
  - name: preship-carries-the-run-reporting-flags
    steps:
      - cmd: preship -b1 --keep-checker-stderr
        expect:
          files_exist:
            - "**/*.checker.err"
          stdout_contains:
            - 'Benchmark: slowest test'
            - 'Total judging:'

  - name: preship-benchmarks-nothing-by-default
    steps:
      - cmd: preship
        expect:
          files_absent:
            - "**/*.checker.err"
          stdout_not_contains:
            - 'Benchmark: slowest test'

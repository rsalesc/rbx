name: fanout
type: communication
timeLimit: 1000
memoryLimit: 256
interactor:
  path: interactor.cpp
  # Three copies of the solution talk to the interactor at once.
  processes: 3
validator:
  path: validator.cpp
generators:
  - name: gen
    path: gens/gen.cpp
testcases:
  - name: samples
    testcaseGlob: manual/*.in
  - name: main
    generators:
      - name: gen
        args: 10 1
      - name: gen
        args: 200 2
solutions:
  - path: sols/main.cpp
    outcome: ACCEPTED
  - path: sols/chatty.cpp
    outcome: ACCEPTED
  - path: sols/wa-ignores-index.cpp
    outcome: WRONG_ANSWER
  - path: sols/wa-shared-state.cpp
    outcome: WRONG_ANSWER
  - path: sols/re-after-accept.cpp
    outcome: RUNTIME_ERROR
  - path: sols/re-process-1.cpp
    outcome: RUNTIME_ERROR
  - path: sols/tle-sum.cpp
    outcome: TIME_LIMIT_EXCEEDED

scenarios:
  - name: run
    description: >
      End-to-end migration of the legacy `test_interactive_problem`
      CLI test. The fixture is a copy of
      `rbx/testdata/problems/interactive/`, exercising the full
      interactor pipeline: generators, validator, interactor, checker,
      and a wide variety of solutions across C++/Python/Java/Kotlin.
      The original test asserted exit 0 plus `'FAILED' not in stdout`;
      we strengthen that to a verdict-by-solution check on the main
      AC reference.
    steps:
      - cmd: run
        expect:
          solutions:
            sols/main.cpp: ac
            sols/ac.py: ac
            sols/ac.java: ac
            sols/ac.kt: ac
            sols/af_wa.cpp: wa
            # Pins the memory-limit fixture per test: the bigger tests run
            # enough binary-search steps for `af_ml.cpp` to allocate past the
            # 256 MiB limit, the smaller ones do not. Asserting it here keeps
            # the ML/TLE race of issue #807 from silently coming back.
            sols/af_ml.cpp:
              tests/3: ml
              tests/4: ml
              tests/5: ml

[tasks.sync]
description = "Install/sync all dependencies"
run = "uv sync --all-groups"

[tasks.lock]
description = "Regenerate uv.lock"
run = "uv lock"

[tasks.lint]
description = "Run linter"
run = "ruff check ."

[tasks.lint-fix]
description = "Run linter with auto-fix"
run = "ruff check --fix ."

[tasks.format]
description = "Format code"
run = "ruff format ."

[tasks.format-check]
description = "Check formatting (no changes)"
run = "ruff format --check ."

[tasks.check]
description = "Run all checks (lint + format)"
run = "mise run lint && mise run format-check"

[tasks.test]
description = "Run tests"
run = "pytest -n auto -m 'not (e2e or slow or docker)'"

[tasks.test-cov]
description = "Run tests with coverage"
run = "pytest -m 'not (e2e or slow or docker)' --cov=rbx --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy"

[tasks.test-e2e]
description = "Run e2e tests"
run = "pytest -m 'e2e and not docker and not pdflatex'"

[tasks.test-e2e-pdflatex]
description = "Run e2e tests that need a real pdflatex (TikZ externalization)"
run = "pytest -m 'e2e and pdflatex and not docker' -v"

[tasks.test-slow]
description = "Run slow tests"
run = "pytest -m 'slow and not docker'"

[tasks.test-docker]
description = "Run docker tests (disabled by default, opt in via RBX_DOCKER_TESTS)"
env = { RBX_DOCKER_TESTS = "1" }
run = "pytest tests/docker -m 'docker' -v -s"

[tasks.domjudge]
description = "Local DOMjudge test server (up | down | creds | logs | ...)"
# e.g. `mise run domjudge up`, `mise run domjudge creds`, `mise run domjudge nuke`.
run = "scripts/domjudge/domjudge.sh {{arg(name='args', var=true, required=false)}}"

[tasks.bump]
description = "Commitizen bump (asks to confirm) + push tags"
# Extra args go to scripts/release.py, and anything it doesn't know on to
# `cz bump` -- e.g. `mise run bump --minor` to force a minor over a major.
run = "python scripts/release.py {{arg(name='bump_args', var=true, required=false)}}"

[tasks.bump-pre]
description = "Commitizen bump pre-release (asks to confirm) + push tags"
run = "python scripts/release.py --prerelease rc {{arg(name='bump_args', var=true, required=false)}}"

[tasks.build]
description = "Clean build the package"
# The .vsix is built first: `rbx vscode install` reads it out of the wheel, and
# a wheel built without it is broken for users only -- every test still passes.
run = [
  "rm -rf dist/ rbx/resources/vscode/",
  "mise run vscode:vsix",
  "uv build",
  # Guard against a stray directory being swept into a release; see
  # [tool.rbx.dist] in pyproject.toml for the limits.
  "python scripts/check_dist_size.py",
]

[tasks.publish]
description = "Build and publish to PyPI"
run = "mise run build && uv publish"

[tasks.publish-schemas]
description = "Publish versioned JSON schemas for the current version"
run = "python scripts/publish_schemas.py"

[tasks.release]
description = "Full release: bump + push tags, publish to PyPI, publish schemas"
# `mise run release --minor` forces a minor bump; the bump is confirmed
# interactively, and declining it aborts before anything is published.
run = [
  "python scripts/release.py {{arg(name='bump_args', var=true, required=false)}}",
  "mise run publish",
  "mise run publish-schemas",
]

[tasks.bench-completion]
description = "Benchmark shell completion latency"
run = "python scripts/bench_completion.py"

[tasks.gen-completion-spec]
description = "Regenerate the committed completion spec from the Typer app"
# serialize writes raw pprint output; ruff-format it so the committed file is
# textually reproducible (the drift test is dict-based, but this avoids churn).
run = "python -m rbx.box.completion.serialize && ruff format rbx/box/completion/_spec.py"

[tasks.record]
description = "Record documentation asciinema casts (all, or the named ones)"
run = "python scripts/record.py"

[tasks.record-check]
description = "Lint asciinema references against committed casts (local only)"
run = "python scripts/record.py --check"

# The VS Code extension is a separate npm project under vscode/ -- its toolchain
# is deliberately independent of the Python one, and its CI must not gate ours.
[tasks."vscode:install"]
description = "Install the VS Code extension's npm dependencies"
dir = "vscode"
run = "npm install"

[tasks."vscode:build"]
description = "Bundle the VS Code extension"
dir = "vscode"
run = "npm run compile"

[tasks."vscode:typecheck"]
description = "Typecheck the VS Code extension"
dir = "vscode"
run = "npm run typecheck"

[tasks."vscode:test"]
description = "Run the VS Code extension's unit tests"
dir = "vscode"
run = "npm test"

[tasks."vscode:package"]
description = "Build the VS Code extension for publishing"
dir = "vscode"
run = "npm run package"

[tasks."vscode:vsix"]
description = "Build the extension .vsix that ships inside the wheel"
dir = "vscode"
run = "npm run package && npm run vsix"

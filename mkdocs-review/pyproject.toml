[project]
name = "mkdocs-review"
version = "0.1.0"
description = "Review mkdocs documentation changes rendered side by side, and comment on them as a GitHub PR review."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "beautifulsoup4>=4.12",
    "pyyaml>=6",
]

[project.scripts]
mkdocs-review = "mkdocs_review.cli:main"

[dependency-groups]
dev = [
    "mkdocs>=1.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "TID", "SLF"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

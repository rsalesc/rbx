fixture: ab-problem
title: Verification levels when building a package
timeout: 400s
setup:
  # BOCA refuses to package without a `boca` limits profile. It is a
  # prerequisite of the recording rather than part of what it teaches, so it
  # is hidden; `-a` skips the interactive strategy prompt.
  - rbx time -p boca -a
instructions:
  # `-v1` stops after generating and validating the tests: no solution is run,
  # so the package is produced without any outcome being verified.
  - rbx package boca -v1
  - !Wait 2s
  - !Clear
  # The default, `-v4`, additionally runs every declared solution and checks
  # each one against its expected outcome. Same command, same format -- the
  # only difference on screen is the work the flag asks for.
  - rbx package boca
expect_contains:
  - Problem packaged for
  - ab_problem.zip
  # Only the -v4 pass runs the solutions, so this is what separates the two
  # halves of the recording.
  - sols/overflow.cpp

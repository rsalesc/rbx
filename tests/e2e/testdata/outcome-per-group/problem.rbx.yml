name: outcome-per-group
timeLimit: 1000
memoryLimit: 256

# `outcomePerGroup` only applies to points-scored problems: a binary problem is
# judged as one pooled verdict, so its groups have no separate judgement for a
# per-group expectation to attach to.
scoring: points

generators:
  - name: gen
    path: gens/gen.cpp

solutions:
  - path: sols/main.cpp
    outcome: ac
  # Declared correctly: accepted on every testgroup except `big`, where it is
  # wrong. Both layers hold, so this solution passes verification.
  - path: sols/partial.cpp
    outcome: incorrect
    outcomePerGroup:
      '*': ac
      big: wa
  # Same program, but claimed to time out on every testgroup. The pooled
  # `incorrect` still holds -- it does fail somewhere -- so only the per-group
  # layer catches it.
  - path: sols/mislabeled.cpp
    outcome: incorrect
    outcomePerGroup:
      '*': tle

testcases:
  - name: small
    score: 40
    subgroups:
      - name: gen
        generators:
          - name: gen
            args: 1 2
          - name: gen
            args: 3 4
  - name: big
    score: 60
    subgroups:
      - name: gen
        generators:
          - name: gen
            args: 1000 2000
          - name: gen
            args: 3000 4000

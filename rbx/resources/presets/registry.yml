# yaml-language-server: $schema=https://rsalesc.github.io/rbx/schemas/PresetRegistry.json
presets:
  - name: "default"
    uri: "default"
    description: "rbx's default preset: ICPC-style problem/contest with testlib, jngen and tgen."
  - name: "olympiad"
    uri: "olympiad"
    description: "IOI-style preset: points-scored problems with optional grader or interactor, and a contest with a Scoring section."

[project]
name = "rbx-cp"
version = "1.4.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Roberto Sales" }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.15.1",
  "fastapi>=0.115.8",
  "filelock>=3.14.0",
  "mechanize>=0.4.10",
  "jinja2>=3.1.4",
  "pydantic>=2.11.7",
  "rich>=13.9.4",
  "pyyaml>=6.0.1",
  "requests>=2.34.0",  # <2.34 warns on chardet>=6 via its compat check
  "latexbuild>=0.2.2",
  "pydantic-xml[lxml]>=2.11.0",
  "more-itertools>=10.5.0",
  "gitpython>=3.1.43",
  "textual>=8.0",
  "pyte>=0.8.2",
  "questionary>=2.1.0",
  "lark>=1.2.2",
  "chardet>=5.2.0",
  "ruyaml>=0.91.0",
  "syncer>=2.0.3",
  "async-lru>=2.0.5",
  "nest-asyncio>=1.6.0",
  "psutil>=7.0.0",
  "textual-serve>=1.1.2",
  "aiofiles>=24.1.0",
  "colour>=0.1.5",
  "beautifulsoup4>=4.13.4",
  "dateparser>=1.2.1",
  "deepmerge>=2.0",
  "yamlfix>=1.17.0",
  "ruamel-yaml>=0.18.14",
  "lz4>=4.4.4",
  "ordered-set>=4.1.0",
  "gitignore-parser>=0.1.12",
  "pypandoc>=1.15",
  "iso639-lang>=2.6.1",
  "sqlitedict>=2.1.0",
  "throttlex>=1.0.0",
  "typing-extensions>=4.14.1",
  "semver>=3.0.4",
  "python-dotenv>=1.1.1",
  "simpleeval>=1.0.3",
  "uvicorn>=0.38.0",
  "openai-agents>=0.3.0",
  "packaging>=25.0",
  "texsoup>=0.3.1",
  "tree-sitter>=0.22.0",
  "tree-sitter-cpp>=0.22.0",
]

[project.scripts]
rbx = "rbx.box.main:app"

[dependency-groups]
dev = [
  "pytest>=8.2.2",
  "ruff>=0.14.3",
  "pre-commit>=3.7.1",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.28",
  "mkdocs-macros-plugin>=1.0.5",
  "termynal>=0.12.1",
  "mkdocstrings[python]>=0.38.0",
  "griffe-fieldz>=0.1.2,<1.0.0",
  "pytest-cov>=5.0.0",
  "textual-dev>=1.6.1",
  "pytest-asyncio>=0.38.0",
  "mkdocs-gen-files>=0.5.0",
  "markdown-grid-tables>=0.5.0",
  "pytest-xdist>=3.8.0",
  "pytest-randomly>=3.15.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
annotated_tag = true
pre_bump_hooks = [
  "uv lock"
]
version_files = [
  "pyproject.toml:^version = ",
  "rbx/__version__.py",
  "rbx/resources/presets/default/preset.rbx.yml:^min_version",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rbx"]
exclude = ["rbx/testdata", "docs"]
# The .vsix is a build output and therefore gitignored, and hatchling drops
# VCS-ignored files from the wheel by default. Without this the wheel builds
# cleanly and `rbx vscode install` is broken for users only.
artifacts = ["rbx/resources/vscode/*.vsix"]

[tool.hatch.build.targets.sdist]
exclude = ["rbx/testdata", ".claude", ".worktrees", "docs", "vscode/node_modules"]
# Also here, not just on the wheel: `uv build` builds the sdist first and then
# the wheel *from that sdist*, so a vsix dropped here never reaches the wheel
# however the wheel target is configured.
artifacts = ["rbx/resources/vscode/*.vsix"]

[tool.rbx.dist]
# Hard ceilings on the artifacts `mise run build` produces, enforced by
# scripts/check_dist_size.py before anything is published. They are here to
# catch a whole directory being swept into a release by accident: 1.2.0 shipped
# a 23.8 MB sdist because vscode/node_modules was never excluded, and nothing
# complained. Raise a limit only when the growth is understood and intended.
max-wheel-mb = 5.0
max-sdist-mb = 5.0

[tool.ruff]
extend-exclude = ["rbx/box/ui/_vendor"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# On top of the defaults (`E4`, E7`, `E9`, and `F`), enable flake8-bugbear (`B`) and flake8-quotes (`Q`).
select = ["E4", "E7", "E9", "F", "B", "I", "TID", "SLF"]
ignore = ["B039", "B905"]

[tool.ruff.lint.isort]
known-third-party = ["agents"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

scenarios:
  - name: run
    description: >
      End-to-end migration of the legacy `test_interactive_problem`
      CLI test, exercising the full interactor pipeline: generators,
      validator, samples, interactor, and a wide variety of solutions
      across C++/Python/Java/Kotlin. The interactor is a modern one: it
      decides every verdict itself, the 25-query limit included, with no
      checker behind it. The original test asserted exit 0 plus
      `'FAILED' not in stdout`; we strengthen that to a
      verdict-by-solution check on the main AC reference.
    steps:
      - cmd: run
        expect:
          solutions:
            sols/main.cpp: ac
            sols/ac.py: ac
            sols/ac.java: ac
            sols/ac.kt: ac
            sols/af_wa.cpp: wa
            # Pins the memory-limit fixture per test: the bigger tests run
            # enough binary-search steps for `af_ml.cpp` to allocate past the
            # 256 MiB limit, the smaller ones do not. Asserting it here keeps
            # the ML/TLE race of issue #807 from silently coming back.
            # `ml+re`, not `ml`: how the limit is enforced differs by platform, so
            # the same solution is ML on macOS and RE on Linux, where RLIMIT_AS
            # makes the allocation itself fail. This still excludes TLE, which is
            # what the #807 guard is about.
            sols/af_ml.cpp:
              tests/3: ml+re
              tests/4: ml+re
              tests/5: ml+re

  - name: package-domjudge
    description: >
      DOMjudge runs a single validator program, and a modern interactor
      is exactly that: it is the sole judge of the interaction. The
      scenario pins the shape: `validation: custom interactive` (which is
      what makes DOMjudge treat the validator as the problem's *run*
      script and hand it a pipe to the submission), the interactor alone
      under `output_validators/` with no checker beside it, and a `build`
      that compiles it straight into `run`.
    steps:
      - cmd: package domjudge
        expect:
          zip_contains:
            path: build/*.zip
            entries:
              - output_validators/interactor.cpp
              - output_validators/build
              - output_validators/testlib.h
          zip_not_contains:
            path: build/*.zip
            entries:
              - output_validators/checker.cpp
          zip_file_contains:
            path: build/*.zip
            entries:
              problem.yaml: "validation: custom interactive"
              output_validators/build: "/-o run interactor\\.cpp/"

name: Upload Python Package

on:
  push:
    tags:
      - "*.*.*" # Will trigger for every tag, alternative: 'v*'

jobs:
  wait-for-tests:
    name: Wait for required checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    # Only wait for tests if this is NOT a release candidate tag
    if: ${{ !contains(github.ref_name, 'rc') }}
    steps:
      - name: Wait for status checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-regexp: '^ubuntu-latest - Python \d+\.\d+\.x$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    # Wait for tests only if the wait-for-tests job actually ran
    needs: wait-for-tests
    if: ${{ always() && (needs.wait-for-tests.result == 'success' || needs.wait-for-tests.result == 'skipped') }}
    environment:
      name: pypi
      url: https://pypi.org/p/rbx.cp
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.14"
      - name: Install dependencies
        run: |
          uv --version
          uv sync --locked --all-groups
      - name: Build
        run: uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-schemas:
    name: Publish versioned JSON schemas
    runs-on: ubuntu-latest
    needs: pypi-publish
    # RC tags must not expose a schema for a version nobody can install yet.
    if: ${{ !contains(github.ref_name, 'rc') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Checkout schemas repo
        uses: actions/checkout@v4
        with:
          repository: rsalesc/rbx-schemas
          token: ${{ secrets.SCHEMAS_DEPLOY_TOKEN }}
          path: .schemas-site
      - name: Build schema site
        run: uv run python -m rbx.box.schema_publish .schemas-site "${{ github.ref_name }}"
      - name: Push
        working-directory: .schemas-site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --staged --quiet; then
            echo "no schema changes"
            exit 0
          fi
          git commit -m "chore: publish schemas for ${{ github.ref_name }}"
          git push

name: Upload Python Package

on:
  push:
    tags:
      - "*.*.*" # Will trigger for every tag, alternative: 'v*'

jobs:
  wait-for-tests:
    name: Wait for required checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    # Only wait for tests if this is NOT a release candidate tag
    if: ${{ !contains(github.ref_name, 'rc') }}
    steps:
      - name: Wait for status checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-regexp: '^ubuntu-latest - Python \d+\.\d+\.x$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    # Wait for tests only if the wait-for-tests job actually ran
    needs: wait-for-tests
    if: ${{ always() && (needs.wait-for-tests.result == 'success' || needs.wait-for-tests.result == 'skipped') }}
    environment:
      name: pypi
      url: https://pypi.org/p/rbx.cp
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.14"
      - name: Install dependencies
        run: |
          uv --version
          uv sync --locked --all-groups
      - name: Build
        run: uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-schemas:
    name: Publish versioned JSON schemas
    runs-on: ubuntu-latest
    needs: pypi-publish
    # RC tags must not expose a schema for a version nobody can install yet.
    if: ${{ !contains(github.ref_name, 'rc') }}
    steps:
      # Releases are normally cut manually with `mise run release`, which
      # publishes schemas over SSH and needs no secret. This job is a backstop,
      # so it skips quietly rather than failing the release when the cross-repo
      # token is not configured. (`GITHUB_TOKEN` cannot write to another repo.)
      - name: Check publish credentials
        id: creds
        env:
          SCHEMAS_DEPLOY_TOKEN: ${{ secrets.SCHEMAS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SCHEMAS_DEPLOY_TOKEN" ]; then
            echo "SCHEMAS_DEPLOY_TOKEN is not set; skipping schema publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'
      - name: Install uv
        if: steps.creds.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.14"
      - name: Install dependencies
        if: steps.creds.outputs.enabled == 'true'
        run: uv sync --locked --all-groups
      - name: Checkout schemas repo
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: rsalesc/rbx-schemas
          token: ${{ secrets.SCHEMAS_DEPLOY_TOKEN }}
          path: .schemas-site
      - name: Configure Git Credentials
        if: steps.creds.outputs.enabled == 'true'
        working-directory: .schemas-site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      # Same script the local `mise run publish-schemas` uses; --dir skips
      # cloning since actions/checkout already made the checkout above.
      - name: Publish schemas
        if: steps.creds.outputs.enabled == 'true'
        run: |
          uv run python scripts/publish_schemas.py \
            --dir .schemas-site \
            --version "${{ github.ref_name }}"

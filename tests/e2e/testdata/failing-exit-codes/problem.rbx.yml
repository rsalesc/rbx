name: failing-exit-codes
timeLimit: 1000
memoryLimit: 256

generators:
  - name: gen
    path: gens/gen.cpp

solutions:
  - path: sols/main.cpp
    outcome: ac
  - path: sols/liar.cpp
    outcome: ac

testcases:
  - name: samples
    subgroups:
      - name: gen
        generators:
          - name: gen
            args: 1 2
  - name: main
    subgroups:
      - name: gen
        generators:
          - name: gen
            args: 3 4

scenarios:
  - name: generate-by-line
    description: >
      `testcases generate <script>:<line>` builds exactly that test (and its
      answer), with no `rbx build` before it.
    steps:
      - cmd: testcases generate tests/plan.txt:3 --output
        expect:
          stdout_contains: 'Generated plan/1'
          file_contains:
            build/tests/plan/001.in: '30 40'
          files_absent:
            - build/tests/plan/000.in

  - name: promote-by-line
    description: >
      `testcases promote <script>:<line>` moves the test into a manual group
      and deletes its line, and the testset still builds afterwards.
    steps:
      - cmd: testcases promote tests/plan.txt:3 --group handmade --name big
        expect:
          file_contains:
            tests/handmade/big.in: '30 40'
      - cmd: testcases promote tests/plan.txt:3 --group handmade
        expect:
          # Line 3 is now the @input, which was the next statement down.
          file_contains:
            tests/handmade/001.in: '5 6'
      - cmd: build
        expect:
          tests:
            count: 4
            groups:
              plan: 1
              handmade: 3

  - name: freeze-in-place
    description: >
      Promoting a test into the group whose plan already holds it, as a copy,
      freezes the generator call into a `@copy` on the same line, so no test
      moves.
    steps:
      - cmd: testcases promote tests/plan.txt:2 --to plan --as copy
        expect:
          file_contains:
            tests/plan/000.in: '1 2'
            tests/plan.txt: "@copy tests/plan/000.in\ngen 30 40"
      - cmd: build
        expect:
          tests:
            count: 4
            groups:
              plan: 3
              handmade: 1

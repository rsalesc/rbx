site_name: rbx
site_description: A tool for creating and managing competitive programming problems
site_author: Roberto Sales
site_url: https://rbx.rsalesc.dev/
repo_url: https://github.com/rsalesc/rbx
repo_name: rsalesc/rbx
# `docs/plans/` is the design and plan archive. It is written for contributors,
# read in the repository, and linked from nowhere on the site -- but it is by far
# the largest thing in `docs/`, so building it dominated every `mkdocs serve`
# rebuild and drowned the build log in macro errors from prose that was never
# meant to be rendered (`{{ ... }}` inside code samples). Excluded outright.
exclude_docs: |
  plans/
nav:
  - "intro/overview.md"
  - "intro/installation.md"
  - "Cheatsheet": "setters/cheatsheet.md"
  - "Walkthrough":
      - "Authoring a problem":
          - "First steps": "setters/first-steps.md"
          - "Adding a custom checker": "setters/custom-checker-walkthrough.md"
          - "Stress-testing your solutions": "setters/stress-testing-walkthrough.md"
      - "Delivering a contest":
          - "Scaffolding a contest": "setters/contest-scaffolding-walkthrough.md"
          - "Profiling time limits": "setters/contest-profiling-walkthrough.md"
          - "Packaging a problem": "setters/packaging-walkthrough.md"
          - "Packaging the whole contest": "setters/contest-packaging-walkthrough.md"
  - "Feature Guide":
      - "Variables": "setters/variables.md"
      - "Testset":
          - "setters/testset/index.md"
          - "Generators": "setters/testset/generators.md"
          - "Visualizers": "setters/testset/visualizers.md"
          - "Stress testing": "setters/stress-testing.md"
      - "Running":
          - "setters/running/index.md"
          - "On the judge itself": "setters/running/remote.md"
      - "Grading":
          - "setters/grading/index.md"
          - "Checkers": "setters/grading/checkers.md"
          - "Interactors": "setters/grading/interactors.md"
      - "Verification":
          - "setters/verification/index.md"
          - "Validators": "setters/verification/validators.md"
          - "Unit tests": "setters/verification/unit-tests.md"
          - "Stress testing": "setters/stress-testing.md"
      - "Profiling":
          - "setters/profiling/index.md"
          - "Limits profiles": "setters/profiling/profiles.md"
          - "Estimating a time limit": "setters/profiling/estimating.md"
          - "How the limit is computed": "setters/profiling/computing.md"
          - "Language groups": "setters/profiling/language-groups.md"
          - "On the judge itself": "setters/profiling/remote.md"
      - "Statements":
          - "Overview": "setters/statements/index.md"
          - "Writing statements": "setters/statements/writing.md"
          - "Template context": "setters/statements/context.md"
          - "Contest statements": "setters/statements/contest.md"
          - "Tutorials": "setters/statements/tutorials.md"
      - "Packaging":
          - "setters/packaging/index.md"
          - "BOCA": "setters/packaging/boca.md"
          - "MOJ": "setters/packaging/moj.md"
          - "Polygon": "setters/packaging/polygon.md"
      - "Presets":
          - "setters/presets/index.md"
  - "Tools":
      - "VS Code extension": "tools/vscode.md"
  - "Reference":
      - "CLI": "setters/reference/cli.md"
      - "Package":
          - "setters/reference/package/index.md"
          - "Schema": "setters/reference/package/schema.md"
      - "Contest":
          - "setters/reference/contest/index.md"
          - "Schema": "setters/reference/contest/schema.md"
      - "Environment":
          - "setters/reference/environment/index.md"
          - "Schema": "setters/reference/environment/schema.md"
  # Internal reference -- notes about rbx's own machinery rather than about
  # authoring problems. Built and linkable, but deliberately kept out of the
  # nav until there is more here. Uncomment to show it.
  # - "Internal reference":
  #     - "JSON schemas": "internal/schemas.md"
  #     - "Backporting a fix": "internal/backporting.md"
  - "Troubleshooting":
      - "Generators and rbx.h": "generators-and-rbx-h.md"
      - "cpp-on-macos.md"
      - "stack-limit.md"
      - "intro/windows-git.md"
      - "Migrating to rbx v1": "migrating-to-v1.md"
theme:
  name: material
  custom_dir: docs/templates
  logo: rbx_black_fit.png
  palette:
    primary: orange
  font:
    text: Source Sans Pro
    code: Source Code Pro
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.expand
    - search.highlight
    - search.suggest
    - toc.follow
plugins:
  - search
  # `include_dir` is what lets a page pull in `docs/_partials/*.md` with
  # `{% include %}`. It has to be the macros plugin doing it rather than
  # pymdownx.snippets: snippets inline the file during Markdown rendering,
  # long after macros ran, so `{{rbx}}` inside a shared partial would reach
  # the page as literal text.
  - macros:
      include_dir: docs
  - termynal
  - autorefs
  - gen-files:
      scripts:
        - rbx/box/dump_schemas.py
        - rbx/box/dump_cli_docs.py
  - mkdocstrings:
      handlers:
        python:
          options:
            unwrap_annotated: true
            extensions:
              - griffe_fieldz
extra:
  rbx: "[rbx](){:.rbx}"
  rbxTeX: "[rbxTeX](/setters/statements/writing)"
  rbxtex: "[rbxTeX](/setters/statements/writing)"
  icpcformat: "[ICPC package format](https://icpc.io/problem-package-format/spec/legacy-icpc.html)"
  codeforces: "[Codeforces](https://codeforces.com)"
  polygon: "[Polygon](https://polygon.codeforces.com)"
  boca: "[BOCA](https://github.com/cassiopc/boca)"
  moj: "[MOJ](https://moj.naquadah.com.br)"
  testlib: "[testlib](https://codeforces.com/testlib)"
  jngen: "[jngen](https://github.com/ifsmirnov/jngen)"
  tgen: "[tgen](https://github.com/brunomaletta/tgen)"
  YAML: "[YAML](https://yaml.org)"
  repo: "[GitHub repository](https://github.com/rsalesc/rbx)"
  Jinja2: "[Jinja2](https://jinja.palletsprojects.com)"
  latex: "[LaTeX](https://www.latex-project.org)"
  regex:
    name: "^[a-zA-Z0-9][a-zA-Z0-9\\-]{2,32}$"
  tags:
    accepted: '<span style="color: green">accepted</span>'
    wrong_answer: '<span style="color: red">wrong answer</span>'
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rsalesc/rbx
extra_css:
  - extra.css
  - assets/asciinema-player.css
extra_javascript:
  - assets/asciinema-player.min.js
  # Must follow the bundle: it wraps AsciinemaPlayer.create to add the loop
  # pause. Every cast on the site is created through it.
  - assets/casts-loop.js
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Renders `++ctrl+s++` as keyboard keys. Without it the `++...++` spelling
  # is left as literal text on the page.
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - markdown_grid_tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"

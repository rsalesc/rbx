fixture: timing-problem
title: Estimating a time limit with rbx time
timeout: 300s
setup:
  # The fixture's environment declares testlib, and the default checker
  # includes it. Materializing it here keeps the recording about estimation
  # rather than about a missing header.
  - rbx download testlib
  # `rbx time` builds and runs on its own; doing it once up front keeps the
  # recording about the estimation flow rather than about compilation.
  - rbx build
instructions:
  - !Interactive
    command: rbx time
    keys:
      # Read the current limits table and the strategy prompt...
      - 4s
      # ...then take the highlighted option, `estimate`, which is the default
      # and the one the page documents first.
      - '^M'
      # Timing both accepted solutions is the long part and the least
      # interesting: every frame is kept, it just plays eight times over.
      - x8
      - 40s
      - x1
      # Accept the default bucketing -- cpp and py estimated from their own
      # timings, java and kt derived from cpp -- and let the profile be
      # written, then the upper-bound check runs.
      - '^M'
      - 12s
expect_contains:
  # The prompt that opens the flow, the per-language table it settles on, the
  # derived limit for the language nothing solves, the upper-bound check that
  # follows, and the file it writes. If any of the five changes shape, the
  # page that embeds this is describing something else.
  - Select how you want to define the time limits
  - Time limits (local)
  - 2.0 of cpp
  - confirmed too slow
  - .limits/local.yml
